[package]
name = "agentboard-scaffold"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# 两个二进制（主程序 + agentboard-hook）时 tauri build 需要知道主二进制
default-run = "agentboard-scaffold"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentboard_scaffold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
notify-debouncer-full = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "agentboard-hook"
path = "src/hook_main.rs"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
